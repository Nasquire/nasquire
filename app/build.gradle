plugins { id 'org.springframework.boot' }
configurations.configureEach { exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging' }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation project(':core')
    if (providers.gradleProperty('full').isPresent()) runtimeOnly project(':full')
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.h2database:h2'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.1.0'
    testImplementation testFixtures(project(':core'))
    testImplementation 'org.apache.pdfbox:pdfbox:3.0.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
processResources {
    dependsOn ':frontend:npm_run_build'
    from(project(':frontend').layout.projectDirectory.dir('dist')) { into 'static' }
    from(rootProject.file('LICENSE')) { into 'static'; rename { 'LICENSE.txt' } }
    from(rootProject.file('LICENSE-EXCEPTIONS.md')) { into 'static' }
}
tasks.named('bootRun') {
    workingDir rootProject.projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Xms64m', '-Xmx256m', '-XX:+UseSerialGC', '-XX:MaxMetaspaceSize=128m', '-XX:ReservedCodeCacheSize=48m', '-Xss512k', '-XX:MaxDirectMemorySize=32m'
}

tasks.named('test') { jvmArgs '--enable-native-access=ALL-UNNAMED' }

// lite 실행 산출물에 full·네이티브 ML 의존성이 다시 유입되는 것을 막는다.
tasks.register('verifyLiteClasspath') {
    onlyIf { !providers.gradleProperty('full').isPresent() }
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group.startsWith('ai.djl') || it.moduleVersion.id.group == 'com.microsoft.onnxruntime' ||
                (it.moduleVersion.id.group == 'com.bluesounds' && it.name == 'full')
        }
        if (!forbidden.empty) throw new GradleException('lite 클래스 경로에 full 의존성이 있습니다')
    }
}
tasks.named('check') { dependsOn 'verifyLiteClasspath' }
