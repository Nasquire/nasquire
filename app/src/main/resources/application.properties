spring.application.name=nasquire
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=true
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.bluesounds.nasquire=INFO
server.error.include-message=never

# 멀티파트는 메모리에 쌓지 않고 디스크에 저장한다. 서비스 상한은 별도 검사한다.
nasquire.upload-max-bytes=33554432
nasquire.trash-retention-days=30
