name: Images
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 다중 아키텍처 이미지 빌드
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=image-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.flavor }}
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 릴리스 태그 구성
        id: tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FLAVOR: ${{ matrix.flavor }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          # 셸/태그 삽입을 막고 Docker 태그 길이를 제한한다.
          [[ "$version" =~ ^[0-9][A-Za-z0-9_.-]*$ && ${#version} -le 110 ]]
          {
            echo 'tags<<TAGS'
            echo "ghcr.io/nasquire/nasquire:$FLAVOR"
            echo "ghcr.io/nasquire/nasquire:$version-$FLAVOR"
            if [[ "$FLAVOR" == lite ]]; then echo 'ghcr.io/nasquire/nasquire:latest'; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 다중 아키텍처 이미지 빌드
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=image-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.flavor }}
