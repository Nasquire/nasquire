plugins { id 'java-library' }
dependencies {
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.poi:poi-scratchpad:5.5.1'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'kr.dogfoot:hwpxlib:1.0.9'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.31.0'
    implementation 'ai.djl.huggingface:tokenizers:0.39.0'
    api 'org.apache.lucene:lucene-core:10.5.2'
    implementation 'org.apache.lucene:lucene-analysis-nori:10.5.2'
    implementation 'org.apache.lucene:lucene-analysis-common:10.5.2'
    implementation 'org.apache.lucene:lucene-queryparser:10.5.2'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'com.ibm.icu:icu4j:79.1'
    testImplementation 'org.apache.pdfbox:pdfbox:3.0.8'
}

tasks.register('generateSamples', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bluesounds.nasquire.core.SampleDocuments'
    args rootProject.layout.buildDirectory.dir('samples').get().asFile.absolutePath
}
