# 독립 예시: docker compose -f deploy/docker-compose.ml.yml up -d
services:
  nasquire-ml:
    image: ghcr.io/nasquire/nasquire:${NASQUIRE_TAG:-full}
    build:
      context: ..
      target: full
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --nasquire.mode=ml
      - --server.address=0.0.0.0
      - --server.port=8080
      - --nasquire.ml.ocr=tesseract
      # 내장 모델은 사전 준비 후 별도 활성화한다(자동 다운로드 기본 off).
      # - --nasquire.ml.embedding=builtin
      # - --nasquire.ml.reranker=builtin
    environment:
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED -Xms64m -Xmx256m -XX:+UseSerialGC -XX:+UseCompactObjectHeaders -XX:MaxHeapFreeRatio=20 -XX:MinHeapFreeRatio=10 -XX:-ShrinkHeapInSteps -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:MaxDirectMemorySize=32m"
      NASQUIRE_MODE: ml
      NASQUIRE_DATA: /data
      NASQUIRE_ML_TOKEN_FILE: /run/secrets/ml-token
      # 원격 공급자 게이트웨이(remote) 예시. 주소는 예시 값이며 키는 파일로만 넘긴다(명령행 금지).
      # 원격으로 바꾼 기능은 위 command의 같은 기능 인자를 지운다(명령행이 환경변수보다 우선).
      # NASQUIRE_ML_EMBEDDING: remote
      # NASQUIRE_ML_EMBEDDING_MODEL: multilingual-e5-large
      # NASQUIRE_ML_EMBEDDING_DIMENSIONS: "1024"
      # NASQUIRE_ML_EMBEDDING_SERVERS: gpu1,gpu2
      # NASQUIRE_ML_EMBEDDING_SERVER_GPU1_URL: https://embed1.example.com/v1
      # NASQUIRE_ML_EMBEDDING_SERVER_GPU1_KEY_FILE: /run/secrets/embed-key
      # NASQUIRE_ML_EMBEDDING_SERVER_GPU2_URL: https://embed2.example.com/v1
      # NASQUIRE_ML_EMBEDDING_SERVER_GPU2_KEY_FILE: /run/secrets/embed-key
      # NASQUIRE_ML_RERANKER: remote
      # NASQUIRE_ML_RERANKER_MODEL: bge-reranker-v2-m3
      # NASQUIRE_ML_RERANKER_SERVERS: infinity
      # NASQUIRE_ML_RERANKER_SERVER_INFINITY_URL: http://infinity.example.com:7997
      # 같은 내부망의 평문 http는 기능별로만 허용한다.
      # NASQUIRE_ML_RERANKER_ALLOW_INSECURE_HTTP: "true"
      # NASQUIRE_ML_DOCLING: remote
      # NASQUIRE_ML_DOCLING_SERVERS: docling
      # NASQUIRE_ML_DOCLING_SERVER_DOCLING_URL: https://docling.example.com
      # NASQUIRE_ML_DOCLING_SERVER_DOCLING_KEY_FILE: /run/secrets/docling-key
      # 문서 추출(/v1/extract, Open WebUI external PUT /process): OCR 최대 쪽 수, 문서당 Docling 최대 쪽 수
      # NASQUIRE_ML_OCR_MAX_PAGES: "20"
      # NASQUIRE_ML_DOCLING_MAX_PAGES: "10"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${ML_DATA_DIR:?ML_DATA_DIR를 준비하세요}:/data
      - ${ML_TOKEN_FILE:?ML_TOKEN_FILE을 준비하세요}:/run/secrets/ml-token:ro
      # - ${EMBED_KEY_FILE}:/run/secrets/embed-key:ro
      # - ${DOCLING_KEY_FILE}:/run/secrets/docling-key:ro
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 160
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
